# voice_node appcpu — APP CPU (Core 1) image
# Runs on xiao_esp32s3/esp32s3/appcpu
#
# No console on this core. Log output is forwarded to procpu via IPM channel 1
# and printed there with a [C1] prefix. See src/main.c:ipm_log().

# ── IPC (inter-processor communication — APP CPU ↔ PRO CPU) ──────────────────
CONFIG_IPM=y

# ── I2S — PDM microphone (MSM261S4030H0R, GPIO41/42) ─────────────────────────
# DMA is required by the ESP32 I2S driver (uses DMA channels 2/3 for RX/TX)
CONFIG_DMA=y
CONFIG_I2S=y
CONFIG_GPIO=y

# ── I2S TX (speaker playback) tuning ─────────────────────────────────────────
# When the driver's internal TX queue empties between blocks, the ISR starts a
# timer.  At 0 ms (default) the timer fires before the producer thread can
# refill the queue, triggering state=ERROR and permanently stopping the DMA.
# 10 ms gives the thread enough runway to write the next block safely.
CONFIG_I2S_ESP32_ALLOWED_EMPTY_TX_QUEUE_DEFERRAL_TIME_MS=10

# ── PSRAM — shared audio buffer (procpu inits hardware; appcpu needs cache) ──
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y

# ── Stack / heap ──────────────────────────────────────────────────────────────
# 6KB: I2S read + mono-strip memcpy + IPM callbacks (SD/FAT write moved to procpu)
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_HEAP_MEM_POOL_SIZE=2048
